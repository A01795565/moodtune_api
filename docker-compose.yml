version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: ${DB_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      # Opcional: Precrea DB vacía; igual ejecutamos scripts
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "${DB_PORT_HOST}:${DB_PORT}"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/00-create-db-and-user.sql:/docker-entrypoint-initdb.d/00-create-db-and-user.sql:ro
      - ./db/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -prootpass || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${API_CONTAINER_NAME}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Estas variables las lee tu app/config.py
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DEBUG: ${DEBUG}
      ALLOW_AUDIT_DELETE: ${ALLOW_AUDIT_DELETE}
    ports:
      - "${API_PORT_HOST}:${API_PORT}"

volumes:
  db_data:
